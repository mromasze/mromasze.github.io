# Static portfolio hosted independently from the Driperska Liga containers.
# The GitHub Actions workflow atomically updates the `current` symlink.
server {
    listen 80;
    listen [::]:80;
    server_name mromasze.dev www.mromasze.dev;
    return 301 https://mromasze.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mromasze.dev www.mromasze.dev;

    # Cloudflare Origin Certificate, trusted when traffic goes through Cloudflare.
    ssl_certificate /etc/nginx/ssl/mromasze.dev/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/mromasze.dev/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host = www.mromasze.dev) {
        return 301 https://mromasze.dev$request_uri;
    }

    root /opt/mromasze-portfolio/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:avif|gif|ico|jpe?g|mp4|png|svg|webm|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Next.js static export can emit either route.html or route/index.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Serve the exported Next.js not-found page instead of the bare nginx 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
